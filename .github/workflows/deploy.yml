name: Deploy

on:
  push:
    branches:
      - canary

jobs:
  deploy:
    runs-on: self-hosted
    environment: canary

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Write .env from GitHub secrets so Prisma and Next.js can connect to the DB.
      # Set these under Settings → Secrets → Actions in your GitHub repo.
      - name: Write .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.POSTGRES_HOST }}:${{ secrets.POSTGRES_PORT }}/${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          EOF

      - name: Generate Prisma client
        run: pnpm prisma generate

      # Bring up the Postgres container and block until its healthcheck passes,
      # otherwise `migrate deploy` races the database and fails to connect.
      - name: Start database
        run: pnpm db:up && pnpm db:wait

      - name: Run migrations
        run: pnpm prisma migrate deploy

      - name: Build
        run: pnpm build

      # Restart the systemd service that runs the app. The runner user needs
      # passwordless sudo for this one command, e.g. in /etc/sudoers.d/recklesslegos:
      #   recklesslegos ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart recklesslegos
      # Adjust the service name to match your unit (recklesslegos.service).
      - name: Restart app
        run: sudo systemctl restart recklesslegos
