name: Deploy

on:
  push:
    branches:
      - canary

jobs:
  deploy:
    runs-on: self-hosted
    environment: canary

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Write .env from GitHub secrets so Prisma and Next.js can connect to the DB.
      # Set these under Settings → Secrets → Actions in your GitHub repo.
      - name: Write .env
        run: |
          cat > .env <<EOF
          DATABASE_URL=postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@${{ secrets.POSTGRES_HOST }}:${{ secrets.POSTGRES_PORT }}/${{ secrets.POSTGRES_DB }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}
          NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_SITE_URL=https://recklessbricks.com
          SMTP_HOST=ssl0.ovh.net
          SMTP_PORT=465
          SMTP_SECURE=true
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          YOUTUBE_API_KEY=${{ secrets.YOUTUBE_API_KEY }}
          BRICKECONOMY_API_KEY=${{ secrets.BRICKECONOMY_API_KEY }}
          CRON_SECRET=${{ secrets.CRON_SECRET }}
          EOF

      - name: Generate Prisma client
        run: pnpm prisma generate

      # Bring up the Postgres container and block until its healthcheck passes,
      # otherwise `migrate deploy` races the database and fails to connect.
      - name: Start database
        run: pnpm db:up && pnpm db:wait

      - name: Run migrations
        run: pnpm prisma migrate deploy

      # Idempotent: only upserts admin accounts, never touches content/timeline
      # data. Set SEED_ADMIN_EMAILS (comma-separated) under Settings → Secrets →
      # Actions to manage admins; defaults to hbouma01@gmail.com when unset.
      - name: Seed admin user(s)
        run: pnpm db:seed:admin
        env:
          SEED_ADMIN_EMAILS: ${{ secrets.SEED_ADMIN_EMAILS }}

      - name: Build
        run: pnpm build

      # Restart the systemd service that runs the app. The runner user needs
      # passwordless sudo for this one command, e.g. in /etc/sudoers.d/recklesslegos:
      #   recklesslegos ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart recklessbricks
      # Adjust the service name to match your unit (recklessbricks.service).
      - name: Restart app
        run: sudo systemctl restart recklessbricks
