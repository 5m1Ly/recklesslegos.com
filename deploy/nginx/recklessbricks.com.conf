# nginx reverse proxy for recklessbricks.com -> Next.js app on 127.0.0.1:3000.
#
# Domains:
#   recklessbricks.com  (+ www)  -> the real site (reverse-proxied to the app)
#   recklessbricks.net  (+ www)  -> 301 redirect to https://recklessbricks.com
#   recklesslego.com    (+ www)  -> 301 redirect to https://recklessbricks.com
#
# Install on the server:
#   sudo cp deploy/nginx/recklessbricks.com.conf /etc/nginx/sites-available/recklessbricks.com
#   sudo ln -s /etc/nginx/sites-available/recklessbricks.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is HTTP-only. Run certbot for ALL six hostnames so each domain
# (including the redirect-only ones) gets a TLS cert:
#   sudo certbot --nginx \
#     -d recklessbricks.com -d www.recklessbricks.com \
#     -d recklessbricks.net -d www.recklessbricks.net \
#     -d recklesslego.com   -d www.recklesslego.com
# certbot rewrites this file in place to add the TLS (443) server blocks and
# HTTP->HTTPS redirects for each server_name.

# --- Real site: recklessbricks.com ---------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name recklessbricks.com www.recklessbricks.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Preserve the original request info for the app.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow WebSocket / connection upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}

# --- Alias domains: redirect everything to recklessbricks.com -------------
server {
    listen 80;
    listen [::]:80;
    server_name recklessbricks.net www.recklessbricks.net
                recklesslego.com   www.recklesslego.com;

    # Permanent redirect, preserving the path/query the visitor came in with.
    return 301 https://recklessbricks.com$request_uri;
}
