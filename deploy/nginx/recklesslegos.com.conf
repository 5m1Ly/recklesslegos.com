# nginx reverse proxy for recklesslegos.com -> Next.js app on 127.0.0.1:3000.
#
# Install on the server:
#   sudo cp deploy/nginx/recklesslegos.com.conf /etc/nginx/sites-available/recklesslegos.com
#   sudo ln -s /etc/nginx/sites-available/recklesslegos.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This file is HTTP-only. Running `sudo certbot --nginx -d recklesslegos.com -d www.recklesslegos.com`
# rewrites it in place to add the TLS (443) server block and an HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name recklesslegos.com www.recklesslegos.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Preserve the original request info for the app.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Allow WebSocket / connection upgrades.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }
}
